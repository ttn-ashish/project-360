<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="p360-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing orbital ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#p360-grad)" stroke-width="3" stroke-dasharray="130 45" stroke-linecap="round" filter="url(#glow)" />
  <!-- Inner core background -->
  <circle cx="32" cy="32" r="20" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  <!-- Dynamic 360 radar sweep / crosshairs -->
  <path d="M32 14 L32 26" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32 38 L32 50" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M14 32 L26 32" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  <path d="M38 32 L50 32" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <!-- Center AI Node -->
  <circle cx="32" cy="32" r="5" fill="url(#p360-grad)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>